# sway pour FrHiOS : pas de barre, pas de bordures, pas de raccourcis. Une seule application
# (l'interface) remplit l'écran ; la fenêtre YouTube (Chromium) est flottante et placée par l'interface.
xwayland disable
default_border none
default_floating_border none
hide_edge_borders both
titlebar_border_thickness 0
font pango:monospace 1
focus_follows_mouse no
focus_on_window_activation none
seat * hide_cursor 4000
input type:keyboard {
    xkb_layout fr
}

# Fenêtre YouTube : flottante et cachée (scratchpad) tant que l'interface ne l'a pas placée
for_window [app_id="^chrome-www\.youtube\.com__.*"] floating enable, border none, move scratchpad

exec /usr/local/bin/frhios-app
