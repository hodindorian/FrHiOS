<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>FrHiOS</title>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Décor : photo teintée violet et cercle magique (Zoltraak) qui tourne. Purement décoratif. -->
  <div class="bg" aria-hidden="true">
    <div class="bg-photo"></div>
    <div class="bg-tint"></div>

    <img class="bg-circle" src="/assets/zoltraak-circle.png" alt="" onerror="this.remove()">
  </div>

  <div class="app">
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>

    <div class="main">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" id="brand-mark"></span>FrHiOS</div>
        <div class="topbar-right">
          <div class="status" id="status"><span class="dot"></span><span id="status-text">…</span></div>
          <button class="icon-btn" id="btn-fullscreen" aria-label="Plein écran"></button>
        </div>
      </header>
      <main class="view" id="view"></main>
      <div class="osk" id="osk" hidden></div>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheet" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
